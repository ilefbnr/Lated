# =============================================================================
# LateD — global runtime configuration
# =============================================================================
#
# PURPOSE
# -------
# Central, declarative configuration for every backend module.
# Read by `lated.common.config_manager.ConfigManager` at startup.
#
# Environment variables (LATED_*) override matching keys here — see
# .env.example for the canonical env var list.
#
# OPERATIONAL NOTES
# -----------------
# - Detection thresholds live in detection_thresholds.yaml, NOT here. This
#   separation lets SOC operators tune detection without redeploying.
# - Section names mirror the Python package layout one-to-one.
# =============================================================================

env: development            # development | staging | production

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:3000

logging:
  level: INFO
  format: json              # json (prod) | console (dev)

# --- Network topology --------------------------------------------------------
# Declarative zoning map. Replaces the legacy "is_private = internal" rule
# applied previously by graph_repository / realtime_graph. Mirrors what every
# real NDR / SIEM expects at onboarding (Splunk networks.csv, Zeek
# Site::local_nets, Suricata HOME_NET, Defender AD-Sites import).
#
# Lookup is longest-prefix-match: a /32 carve-out for a critical host overrides
# any broader /16 zone above it.
#
# Each zone entry:
#   cidr      : IPv4 or IPv6 CIDR (mandatory)
#   zone      : corporate | dmz | datacenter | iot | ot | public_owned |
#               partner | external
#   trust     : trusted | semi_trusted | untrusted   (default: trusted)
#   name      : human-readable label                 (optional)
#   sensitive : true -> hosts in this CIDR are treated as critical assets
#               for severity escalation                                (default: false)
#
# Leave `zones: []` and `critical_assets: []` to keep the legacy RFC 1918
# behaviour (any private IP = internal, any public IP = external).
network_topology:
  zones: []
  # Host_ids or IP addresses considered critical assets (DCs, prod DBs, jump
  # hosts). Combined with the `sensitive: true` flag on zones above.
  critical_assets: []

# --- Discovery ---------------------------------------------------------------
discovery:
  mode: passive             # passive | active | hybrid
  passive_window_seconds: 86400
  active_scan_enabled: false
  arp_enabled: true
  dns_enabled: true

# --- Ingestion ---------------------------------------------------------------
ingestion:
  mode: live              # replay | live | replay_live
  source: zeek            # pcap | zeek | netflow
  pcap_interface: ""      # only used when source = pcap
  pcap_path: ""           # used in replay mode for pcap file input
  # LIVE: tail Zeek logs produced by the sensor running in WSL2 (eth0).
  zeek_log_dir: "\\\\wsl$\\Ubuntu\\home\\ilefb7\\zeek-live"
  # PicoDomain replay (revert here to go back to offline demo):
  # zeek_log_dir: "C:\\Users\\ilefb\\OneDrive\\Bureau\\LateD\\backend\\data\\picodomain\\2019-07-19"
  netflow_port: 2055
  batch_size: 1000
  # replay_live only: N archived-time seconds per 1 wall-clock second.
  # ×1 = real-time, ×60 = one minute of wall-clock plays one hour of logs.
  replay_speed: 60
  # Zeek log types tailed/replayed in live + replay_live modes. The
  # LiveZeekEnricher joins enrichment logs onto conn records by uid.
  zeek_log_types:
    - conn
    - smb_files
    - smb_mapping
    - dce_rpc
    - ntlm
    - kerberos

# --- Temporal graph ----------------------------------------------------------
graph:
  snapshot_window_seconds: 30
  snapshot_overlap: false   # snapshots must NOT overlap (architectural invariant)
  max_in_memory_snapshots: 240    # 2 hours at 30s/snapshot
  edge_feature_set:
    - bytes
    - packets
    - duration
    - port_entropy
    - fan_out
    - fan_in
    - temporal_delta

# --- Detection ---------------------------------------------------------------
detection:
  tgnn:
    # Paths are resolved relative to backend/. Set LATED_DEV_MODE=1 to load
    # without the signature/metadata sidecars.
    #
    # Override at runtime with LATED_TGN_MODEL=<name-or-path>. The runtime
    # auto-resolves the matching node-mapping by checkpoint filename:
    #   tgn_supervised_m5_n015.pt → data/datasets/train_m5_n015.pt
    #   tgn_backbone_m2_n015.pt   → data/datasets/train_m2_n015.pt
    #
    # Run `python -c "import sys; sys.path.insert(0,'src'); from lated.tools.compare_tgn_models import *; print_table(scan_models(__import__('pathlib').Path('data/models')))"`
    # to see a ranked comparison of every checkpoint.
    #
    # Family choices (best → worst by PicoDomain AUC-ROC):
    #   supervised  end-to-end LM head, sigmoid = LM probability  ← recommended
    #   lm_head     LM head only (needs companion backbone)
    #   backbone    SSL link-prediction, 1-sigmoid = anomaly
    model_path: data/models/tgn_supervised_m5_n015.pt
    node_mapping_path: ""   # leave empty for auto-resolution by filename
    device: cpu             # cpu | cuda
    batch_size: 64
  recon:
    window_seconds: 60
    min_unique_dst: 25
  fusion:
    weight_lm: 0.6
    weight_recon: 0.3
    weight_history: 0.1

# --- Correlation -------------------------------------------------------------
correlation:
  temporal_continuity_seconds: 300
  max_path_length: 8
  enable_mitre_tags: true

# --- Supervision -------------------------------------------------------------
supervision:
  alerts:
    persistence: postgres
    retention_days: 365
  websocket:
    heartbeat_seconds: 15
    auth_required: true
